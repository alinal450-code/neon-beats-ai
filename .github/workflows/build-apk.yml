
name: Build NEON BEATS AI APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q NEON_BEATS_AI_Android_Project_v0_1.zip -d extracted
          cp -a extracted/. .

      - name: Fix Java and Kotlin versions
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.neonbeats.ai'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.neonbeats.ai'
                  minSdk 26
                  targetSdk 35
                  versionCode 2
                  versionName '0.2.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NEON-BEATS-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
